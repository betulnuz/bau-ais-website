<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — BAU AIS</title>
<link rel="stylesheet" href="styles.css">
<style>
/* ── PAGE ── */
.contact-page {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
  background: var(--navy-900);
  padding: calc(var(--header-h) + 3rem) var(--gutter) 4rem;
}

/* ── ROBOT CANVAS ── */
#robotCanvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
  opacity: 1;
}

/* ── GRID OVERLAY ── */
.grid-overlay {
  position: absolute;
  inset: 0;
  z-index: 1;
  background-image:
    linear-gradient(rgba(77,255,170,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(77,255,170,0.03) 1px, transparent 1px);
  background-size: 48px 48px;
  pointer-events: none;
}

/* ── SCAN LINE ── */
.scanline {
  position: absolute;
  left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg, transparent, rgba(77,255,170,0.15), transparent);
  z-index: 2;
  animation: scanDown 8s linear infinite;
  pointer-events: none;
}
@keyframes scanDown {
  0%   { top: -2px; opacity: 0; }
  5%   { opacity: 1; }
  95%  { opacity: 1; }
  100% { top: 100%; opacity: 0; }
}

/* ── CORNER BRACKETS ── */
.corners {
  position: absolute;
  inset: 2rem;
  z-index: 2;
  pointer-events: none;
}
.corners span {
  position: absolute;
  width: 32px; height: 32px;
  border-color: rgba(77,255,170,0.2);
  border-style: solid;
  transition: border-color 0.5s;
}
.corners span:nth-child(1) { top: 0; left: 0; border-width: 1px 0 0 1px; }
.corners span:nth-child(2) { top: 0; right: 0; border-width: 1px 1px 0 0; }
.corners span:nth-child(3) { bottom: 0; left: 0; border-width: 0 0 1px 1px; }
.corners span:nth-child(4) { bottom: 0; right: 0; border-width: 0 1px 1px 0; }

/* ── STATUS BAR ── */
.status-bar {
  position: absolute;
  top: calc(var(--header-h) + 1.5rem);
  left: 0; right: 0;
  display: flex;
  justify-content: space-between;
  padding: 0 2.5rem;
  font-family: var(--font-mono);
  font-size: 0.62rem;
  letter-spacing: 0.22em;
  color: rgba(77,255,170,0.4);
  text-transform: uppercase;
  z-index: 3;
  pointer-events: none;
}
.status-dot {
  display: inline-block;
  width: 5px; height: 5px;
  border-radius: 50%;
  background: var(--green);
  margin-right: 0.5rem;
  animation: blink 2s ease-in-out infinite;
  vertical-align: middle;
}
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.2} }

/* ── MAIN CONTENT ── */
.contact-content {
  position: relative;
  z-index: 4;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  gap: 3.5rem;
}

/* ── HEADING ── */
.contact-heading {
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
}
.contact-eyebrow {
  font-family: var(--font-mono);
  font-size: 0.68rem;
  letter-spacing: 0.35em;
  color: var(--green);
  text-transform: uppercase;
  opacity: 0.7;
}
.contact-title {
  font-family: var(--font-display);
  font-size: clamp(3.5rem, 12vw, 9rem);
  line-height: 0.88;
  letter-spacing: 0.05em;
  color: var(--white);
  text-transform: uppercase;
}
.contact-title em {
  display: block;
  font-style: normal;
  color: var(--green);
}

/* ── LINKS ── */
.contact-links {
  display: flex;
  flex-direction: column;
  gap: 1px;
  width: 100%;
  max-width: 560px;
}

.contact-link {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 2rem;
  padding: 1.8rem 2.2rem;
  background: rgba(8,17,46,0.7);
  border: 1px solid rgba(255,255,255,0.06);
  border-left: 3px solid transparent;
  backdrop-filter: blur(12px);
  transition: all 0.35s cubic-bezier(0.16,1,0.3,1);
  text-decoration: none;
  color: var(--off-white);
  position: relative;
  overflow: hidden;
}
.contact-link::before {
  content: '';
  position: absolute;
  inset: 0;
  background: rgba(77,255,170,0.03);
  transform: translateX(-100%);
  transition: transform 0.4s cubic-bezier(0.16,1,0.3,1);
}
.contact-link:hover {
  border-left-color: var(--green);
  background: rgba(13,26,63,0.9);
  transform: translateX(6px);
}
.contact-link:hover::before { transform: translateX(0); }

.link-left {
  display: flex;
  align-items: center;
  gap: 1.4rem;
}
.link-icon {
  width: 42px; height: 42px;
  border: 1px solid rgba(77,255,170,0.2);
  display: grid;
  place-items: center;
  flex-shrink: 0;
  transition: border-color 0.3s, background 0.3s;
  background: rgba(77,255,170,0.04);
}
.contact-link:hover .link-icon {
  border-color: var(--green);
  background: rgba(77,255,170,0.1);
}
.link-icon svg {
  width: 18px; height: 18px;
  color: var(--green);
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
}

.link-text {
  display: flex;
  flex-direction: column;
  gap: 0.15rem;
  text-align: left;
}
.link-label {
  font-family: var(--font-mono);
  font-size: 0.62rem;
  letter-spacing: 0.22em;
  color: var(--green);
  text-transform: uppercase;
  opacity: 0.7;
}
.link-value {
  font-family: var(--font-display);
  font-size: 1.3rem;
  letter-spacing: 0.05em;
  color: var(--white);
  text-transform: uppercase;
}

.link-arrow {
  font-family: var(--font-mono);
  font-size: 0.9rem;
  color: rgba(77,255,170,0.4);
  transition: color 0.3s, transform 0.3s;
  flex-shrink: 0;
}
.contact-link:hover .link-arrow {
  color: var(--green);
  transform: translateX(4px);
}

/* ── COORDINATES ── */
.contact-coords {
  font-family: var(--font-mono);
  font-size: 0.62rem;
  letter-spacing: 0.22em;
  color: rgba(77,255,170,0.3);
  text-transform: uppercase;
}

/* ── ANIMATIONS ── */
.contact-content > * {
  opacity: 0;
  transform: translateY(24px);
  animation: fadeUp 0.8s cubic-bezier(0.16,1,0.3,1) forwards;
}
.contact-content > *:nth-child(1) { animation-delay: 0.1s; }
.contact-content > *:nth-child(2) { animation-delay: 0.25s; }
.contact-content > *:nth-child(3) { animation-delay: 0.45s; }
@keyframes fadeUp {
  to { opacity: 1; transform: none; }
}

/* ── FLOATING DATA NODES ── */
.data-node {
  position: absolute;
  font-family: var(--font-mono);
  font-size: 0.58rem;
  letter-spacing: 0.15em;
  color: rgba(77,255,170,0.15);
  text-transform: uppercase;
  pointer-events: none;
  z-index: 2;
  white-space: nowrap;
}
</style>
</head>
<body>

<script src="main.js"></script>
<script>
(function () {
  const canvas = document.getElementById('robotCanvas');
  const ctx = canvas.getContext('2d');
  const G = '#4dffaa';
  let W, H, nodes, edges, packets, dpr;

  /* ── resize ── */
  function resize() {
    dpr = Math.min(devicePixelRatio || 1, 2);
    W = canvas.clientWidth;
    H = canvas.clientHeight;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    build();
  }

  /* ── build circuit graph ── */
  function build() {
    nodes = [];
    edges = [];
    packets = [];

    // Snap to a grid with jitter — looks like a PCB
    const cols = Math.ceil(W / 90) + 1;
    const rows = Math.ceil(H / 90) + 1;
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        if (Math.random() < 0.55) continue; // sparse
        nodes.push({
          x: c * 90 + (Math.random() - 0.5) * 28,
          y: r * 90 + (Math.random() - 0.5) * 28,
          r: Math.random() < 0.15 ? 4 : 2,
          pulse: Math.random() * Math.PI * 2,
        });
      }
    }

    // Connect nearby nodes with orthogonal-ish lines
    for (let i = 0; i < nodes.length; i++) {
      let connected = 0;
      for (let j = i + 1; j < nodes.length; j++) {
        const dx = nodes[j].x - nodes[i].x;
        const dy = nodes[j].y - nodes[i].y;
        const d = Math.hypot(dx, dy);
        if (d < 130 && connected < 3 && Math.random() < 0.6) {
          edges.push({ a: i, b: j, d });
          connected++;
        }
      }
    }

    // Spawn initial packets
    for (let k = 0; k < 18; k++) spawnPacket();
  }

  function spawnPacket() {
    if (edges.length === 0) return;
    const e = edges[Math.floor(Math.random() * edges.length)];
    packets.push({
      ei: edges.indexOf(e),
      t: Math.random(),           // 0→1 along edge
      dir: Math.random() < 0.5 ? 1 : -1,
      speed: 0.002 + Math.random() * 0.003,
      alpha: 0.6 + Math.random() * 0.4,
    });
  }

  /* ── draw ── */
  function draw() {
    ctx.clearRect(0, 0, W, H);
    const t = performance.now() / 1000;

    // Edges
    edges.forEach(({ a, b }) => {
      const na = nodes[a], nb = nodes[b];
      ctx.beginPath();
      // Orthogonal path: go horizontal then vertical
      const mx = nb.x;
      const my = na.y;
      ctx.moveTo(na.x, na.y);
      ctx.lineTo(mx, my);
      ctx.lineTo(nb.x, nb.y);
      ctx.strokeStyle = 'rgba(77,255,170,0.07)';
      ctx.lineWidth = 1;
      ctx.stroke();
    });

    // Nodes
    nodes.forEach(n => {
      const pulse = 0.5 + 0.5 * Math.sin(t * 1.4 + n.pulse);
      // Outer glow ring (only big nodes)
      if (n.r > 2) {
        ctx.beginPath();
        ctx.arc(n.x, n.y, n.r * 3 * pulse, 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(77,255,170,${0.08 * pulse})`;
        ctx.lineWidth = 1;
        ctx.stroke();
      }
      // Core dot
      ctx.beginPath();
      ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(77,255,170,${n.r > 2 ? 0.4 + 0.3 * pulse : 0.18})`;
      ctx.fill();
      // Cross marker on large nodes
      if (n.r > 2) {
        ctx.strokeStyle = `rgba(77,255,170,${0.25 * pulse})`;
        ctx.lineWidth = 0.8;
        ctx.beginPath();
        ctx.moveTo(n.x - 8, n.y); ctx.lineTo(n.x + 8, n.y);
        ctx.moveTo(n.x, n.y - 8); ctx.lineTo(n.x, n.y + 8);
        ctx.stroke();
      }
    });

    // Packets (data flowing along edges)
    packets = packets.filter(p => {
      const e = edges[p.ei];
      if (!e) return false;
      p.t += p.speed * p.dir;
      if (p.t > 1 || p.t < 0) {
        spawnPacket();
        return false;
      }
      const na = nodes[e.a], nb = nodes[e.b];
      // Same orthogonal path as edge
      const mx = nb.x, my = na.y;
      let px, py;
      if (p.t < 0.5) {
        px = na.x + (mx - na.x) * (p.t * 2);
        py = na.y;
      } else {
        px = mx;
        py = my + (nb.y - my) * ((p.t - 0.5) * 2);
      }
      ctx.beginPath();
      ctx.arc(px, py, 2, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(77,255,170,${p.alpha})`;
      ctx.fill();
      // Trail
      ctx.beginPath();
      ctx.arc(px, py, 5, 0, Math.PI * 2);
      const g = ctx.createRadialGradient(px, py, 0, px, py, 5);
      g.addColorStop(0, `rgba(77,255,170,0.25)`);
      g.addColorStop(1, `rgba(77,255,170,0)`);
      ctx.fillStyle = g;
      ctx.fill();
      return true;
    });

    requestAnimationFrame(draw);
  }

  window.addEventListener('resize', resize, { passive: true });
  resize();
  draw();

  // Floating data labels
  const labels = [
    'SYS_STATUS: ONLINE', 'NET: 192.168.1.42', 'PKT_LOSS: 0.00%',
    'UPTIME: 99.97%', 'LAT: 41.068°N', 'LNG: 29.047°E',
    'NODE_COUNT: 60+', 'PROTO: HTTPS', 'SIGNAL: STRONG',
    'CLUSTER: BAU_AIS', 'MODE: ACTIVE', 'PING: 12ms',
  ];
  const page = document.querySelector('.contact-page');
  labels.forEach((txt, i) => {
    const el = document.createElement('div');
    el.className = 'data-node';
    el.textContent = txt;
    el.style.cssText = `
      left: ${5 + Math.random() * 85}%;
      top: ${8 + Math.random() * 80}%;
      animation: fadeNode ${4 + Math.random() * 6}s ease-in-out ${Math.random() * 5}s infinite alternate;
    `;
    page.appendChild(el);
  });

  const style = document.createElement('style');
  style.textContent = `
    @keyframes fadeNode {
      0%   { opacity: 0.05; }
      50%  { opacity: 0.22; }
      100% { opacity: 0.07; }
    }
  `;
  document.head.appendChild(style);
})();
</script>
</body>
